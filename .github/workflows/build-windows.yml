name: Build from uploaded zip

on: workflow_dispatch

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Find and unzip the source
        run: |
          $ErrorActionPreference = "Stop"
          # Already unzipped in the repository? (main.py next to a "waterpy" folder)
          $main = Get-ChildItem -Recurse -Filter main.py | Where-Object { Test-Path (Join-Path $_.DirectoryName "waterpy") } | Select-Object -First 1
          if (-not $main) {
            # Otherwise use the newest .zip anywhere in the repository (also inside .github)
            $zip = Get-ChildItem -Recurse -Filter *.zip | Sort-Object LastWriteTime | Select-Object -Last 1
            if (-not $zip) { throw "No .zip file found in the repository. Upload WaterPyDesktop-source-v0.6.0.zip first." }
            Write-Host "Using zip: $($zip.FullName)"
            Expand-Archive -Path $zip.FullName -DestinationPath src -Force
            $main = Get-ChildItem src -Recurse -Filter main.py | Where-Object { Test-Path (Join-Path $_.DirectoryName "waterpy") } | Select-Object -First 1
          }
          if (-not $main) { throw "The zip does not contain main.py and the waterpy folder." }
          Write-Host "Project folder: $($main.DirectoryName)"
          "APPDIR=$($main.DirectoryName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build WaterPyDesktop.exe and setup.exe
        working-directory: ${{ env.APPDIR }}
        run: |
          $ErrorActionPreference = "Stop"
          function Check($step) { if ($LASTEXITCODE -ne 0) { throw "$step failed (exit code $LASTEXITCODE)" } }

          python -m pip install --upgrade pip;            Check "pip upgrade"
          python -m pip install -r requirements.txt;      Check "pip install"

          python -m PyInstaller --noconfirm --clean --windowed --onedir --name WaterPyDesktop `
            --icon "waterpy\resources\waterpy.ico" --add-data "waterpy\resources;waterpy\resources" `
            --add-data "plugins;plugins" --add-data "sdk;sdk" --add-data "examples;examples" `
            --add-data "README.md;." --add-data "PLUGIN_SDK.md;." --add-data "CHANGELOG.md;." `
            --collect-submodules waterpy main.py
          Check "PyInstaller"
          if (-not (Test-Path "dist\WaterPyDesktop\WaterPyDesktop.exe")) { throw "WaterPyDesktop.exe was not created" }

          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) {
            choco install nsis -y --no-progress;          Check "NSIS install"
          }
          $makensis = (Get-Command makensis -ErrorAction SilentlyContinue).Source
          if (-not $makensis) { $makensis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe" }

          $v = (Get-Content VERSION).Trim()
          Push-Location installer
          & $makensis /V2 "/DVERSION=$v" WaterPyDesktop.nsi
          Check "makensis"
          Pop-Location

          Compress-Archive -Path "dist\WaterPyDesktop\*" -DestinationPath "dist\WaterPyDesktop-$v-portable.zip" -Force

          New-Item -ItemType Directory -Force -Path "$env:GITHUB_WORKSPACE\output" | Out-Null
          Copy-Item "dist\WaterPyDesktop-$v-setup.exe", "dist\WaterPyDesktop-$v-portable.zip" "$env:GITHUB_WORKSPACE\output\"
          Get-ChildItem "$env:GITHUB_WORKSPACE\output" | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: WaterPyDesktop-windows
          path: output/*
          if-no-files-found: error
